name: Build Colamanga Zygisk Module

on:
  push:
    paths:
      - 'zygisk/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip
          echo "NDK extracted"

      - name: Compile arm64-v8a.so
        run: |
          NDK=$PWD/android-ndk-r25c
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          cd zygisk
          $CXX -shared -fPIC -O2 -std=c++17 -I. \
            -o arm64-v8a.so colamanga_hook.cpp \
            -ldl -llog -landroid \
            -Wl,--exclude-libs,ALL -Wl,--gc-sections \
            -ffunction-sections -fdata-sections \
            -DZYGISK_API_VERSION=4
          file arm64-v8a.so
          ls -la arm64-v8a.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: colamanga-zygisk-so
          path: zygisk/arm64-v8a.so

      - name: Package full module
        run: |
          mkdir -p dist/zygisk
          cp module.prop dist/
          cp service.sh dist/
          cp post-fs-data.sh dist/
          cp customize.sh dist/
          cp uninstall.sh dist/
          cp -r config dist/
          cp -r control dist/
          cp -r webui dist/
          cp -r META-INF dist/
          cp zygisk/arm64-v8a.so dist/zygisk/
          cd dist
          zip -r ../ColamangaUltimateBreaker.zip .
          cd ..
          ls -la ColamangaUltimateBreaker.zip

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: ColamangaUltimateBreaker
          path: ColamangaUltimateBreaker.zip