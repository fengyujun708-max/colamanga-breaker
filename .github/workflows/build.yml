name: Build Colamanga Hook

on:
  push:
    paths:
      - 'zygisk/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip

      - name: Compile libcolamanga_hook.so
        run: |
          NDK=$PWD/android-ndk-r25c
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          cd zygisk
          $CXX -shared -fPIC -O2 -std=c++17 \
            -o libcolamanga_hook.so colamanga_hook.cpp \
            -ldl -llog -landroid \
            -Wl,--exclude-libs,ALL -Wl,--gc-sections
          file libcolamanga_hook.so
          ls -la libcolamanga_hook.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: colamanga-hook-so
          path: zygisk/libcolamanga_hook.so