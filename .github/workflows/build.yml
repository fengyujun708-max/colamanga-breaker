name: Build Colamanga Zygisk Module

on:
  push:
    paths:
      - 'zygisk/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip

      - name: Compile Zygisk module (arm64-v8a.so)
        run: |
          NDK=$PWD/android-ndk-r25c
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          cd zygisk
          $CXX -shared -fPIC -O2 -std=c++17 -I. \
            -o arm64-v8a.so colamanga_zygisk.cpp \
            -ldl -llog -landroid \
            -Wl,--exclude-libs,ALL -Wl,--gc-sections -Wl,-z,max-page-size=16384
          file arm64-v8a.so
          ls -la arm64-v8a.so

      - name: Upload Zygisk module so
        uses: actions/upload-artifact@v4
        with:
          name: colamanga-zygisk-so
          path: zygisk/arm64-v8a.so