<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Colamanga Breaker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0a0e17;color:#e0e0e0;padding:8px;max-width:900px;margin:0 auto}
h1{font-size:16px;color:#00d9f5}
.sub{font-size:10px;color:#555;margin-bottom:8px}
.c{background:#131722;border:1px solid #1e2536;border-radius:6px;padding:8px;margin-bottom:8px}
.c h2{font-size:13px;color:#00d9f5;margin-bottom:6px}
.btn{display:inline-block;padding:6px 12px;margin:2px;border:0;border-radius:4px;font-size:11px;cursor:pointer;text-decoration:none}
.b1{background:#00d9f5;color:#000}.b2{background:#ffa502;color:#000}.b3{background:#ff4757;color:#fff}.b4{background:#2a2f3e;color:#aaa;border:1px solid #3a3f4e}
.out{background:#0a0e17;border:1px solid #1e2536;border-radius:4px;padding:6px;font-family:monospace;font-size:10px;min-height:120px;max-height:350px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#0f0;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.g{background:#00f5a0}.r{background:#ff4757}.y{background:#ffa502}
</style>
</head>
<body>
<h1>⚡ Colamanga Breaker</h1>
<div class="sub" id="sub">com.hswl.car_owner / com.hswl.cargo_owner.cargo_owner</div>

<div class="c">
<h2><span class="dot r" id="sd"></span> 状态 <span id="bridge" style="font-size:10px;color:#888"></span></h2>
<button class="btn b4" onclick="run('status')">📊 状态</button>
<button class="btn b1" onclick="run('diagnosis')">🔍 诊断</button>
<button class="btn b4" onclick="run('lspd_log')">📜 模块日志</button>
<button class="btn b4" onclick="run('servers')">🌐 服务器追踪</button>
</div>

<div class="c">
<h2>📱 设备身份（实时改，杀app生效不重启手机）</h2>
<button class="btn b4" onclick="run('set_profile profile_xiaomi')">小米</button>
<button class="btn b4" onclick="run('set_profile profile_oneplus')">一加</button>
<button class="btn b4" onclick="run('set_profile profile_oppo')">OPPO</button>
<button class="btn b2" onclick="run('randomize_device')">🎲 随机新设备</button>
<button class="btn b4" onclick="run('get_props')">📋 查看属性</button>
</div>

<div class="c">
<h2>🔧 监控（按需开，防发烫）</h2>
<button class="btn b1" onclick="run('capture start')">▶️ 开抓包</button>
<button class="btn b3" onclick="run('capture stop')">⏹ 停抓包</button>
<button class="btn b1" onclick="run('logmon start')">▶️ 开日志监控</button>
<button class="btn b3" onclick="run('logmon stop')">⏹ 停日志</button>
</div>

<div class="c">
<h2>🛡 保护</h2>
<button class="btn b4" onclick="run('snapshot')">📸 快照广告数据</button>
<button class="btn b2" onclick="run('restore')">♻️ 恢复快照</button>
<button class="btn b3" onclick="run('safe_mode on')">🛑 安全模式</button>
<button class="btn b4" onclick="run('safe_mode off')">✅ 恢复Hook</button>
<button class="btn b2" onclick="run('kill_app')">⏹ 停止漫城</button>
</div>

<div class="c">
<h2>🔌 Frida</h2>
<button class="btn b1" onclick="run('frida start')">🚀 启动</button>
<button class="btn b3" onclick="run('frida stop')">⏹ 停止</button>
<button class="btn b4" onclick="run('frida status')">📊 状态</button>
</div>

<div class="c">
<h2>📤 输出</h2>
<div class="out" id="out">点击按钮执行...</div>
</div>

<script>
var MOD='/data/adb/modules/colamanga_mod';
var CTL=MOD+'/control/control.sh';
function exec(cmd, cb){
  if(window.ksu && window.ksu.exec){
    var cbn='cb'+Math.random().toString(36).slice(2);
    window[cbn]=function(errno,stdout,stderr){delete window[cbn]; cb(stdout||stderr||'(空)',errno);};
    window.ksu.exec('sh '+CTL+' '+cmd,'{}',cbn);
  } else {
    cb('无桥接：请在 KSU WebUI 中打开，或浏览器访问 http://127.0.0.1:8799',-1);
  }
}
function run(cmd){
  var el=document.getElementById('out');
  el.textContent='执行中: '+cmd+' ...';
  exec(cmd, function(r,err){
    el.textContent=r;
    if(cmd==='status'){ try{var d=JSON.parse(r); if(d.pid1||d.pid2){document.getElementById('sd').className='dot g';}else{document.getElementById('sd').className='dot r';} }catch(e){} }
  });
}
document.getElementById('bridge').textContent = (window.ksu&&window.ksu.exec)?'[KSU桥接✅]':'[无桥接❌]';
run('diagnosis');
</script>
</body>
</html>
